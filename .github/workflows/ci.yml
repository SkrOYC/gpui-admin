name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test-clippy:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # GPUI's native graphics/windowing/font stack. The CI runners are not
      # under devenv, so the Linux job installs the same libraries devenv
      # provides locally. macOS uses system frameworks (Metal / CoreText).
      - name: Install GPUI system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxext-dev libxcb1-dev \
            libvulkan-dev \
            libfontconfig-1-dev libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace
