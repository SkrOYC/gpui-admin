[workspace]
resolver = "3"
members = [
    "crates/gpui-admin",
    "crates/gpui-admin-core",
    "crates/gpui-admin-macros",
    "crates/gpui-admin-cli",
    "crates/gpui-admin-ui",
    "crates/gpui-admin-conformance",
    "crates/gpui-admin-provider-supabase",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/SkrOYC/gpui-admin"
authors = ["gpui-admin contributors"]

[workspace.dependencies]
# --- Substrate family — exact-pinned (ADR-004). ---
# Platform backends are gpui feature flags (wayland + x11 are default-on for
# Linux; macOS uses metal), NOT a sibling crate — so there is no gpui_platform.
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui_http_client = "=0.2.2"

# --- Runtime & Provider dependencies (caret + committed lockfile). ---
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dirs = "6.0.0"
schemars = "1.2.1"

# --- Toolchain & derivation crates. ---
clap = { version = "4.6.1", features = ["derive"] }
postgres = "0.19.14"
openapiv3 = "2.2.0"
syn = { version = "2.0.118", features = ["full"] }
quote = "1.0.46"
proc-macro2 = "1.0.106"
prettyplease = "0.2.37"

# --- Testing. ---
insta = "1.48.0"
anyhow = "1.0.103"

# --- Intra-workspace crates. ---
gpui-admin-core = { path = "crates/gpui-admin-core", version = "0.0.1" }
gpui-admin-ui = { path = "crates/gpui-admin-ui", version = "0.0.1" }
gpui-admin-macros = { path = "crates/gpui-admin-macros", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Curated allows — a pragmatic starter set for a framework crate family; revisit
# as real code lands.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
